# ──────────────────────────────────────────────────────────────
# Destroy Pipeline
#
# Triggers: manual dispatch only
# Steps:
#   1. Safety gate (confirmation + prod warning)
#   2. Terraform init (remote S3 state) → plan -destroy → destroy
#   3. Optional ECR image cleanup
#
# State is updated in S3 after destroy — subsequent plans show
# a clean slate. Re-deploying just runs the deploy pipeline.
# ──────────────────────────────────────────────────────────────

name: Destroy AgentCore Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        default: "dev"
        type: choice
        options: [dev, staging, prod]
      confirm:
        description: "Type 'destroy' to confirm teardown"
        required: true
        type: string
      delete_ecr_images:
        description: "Also delete all ECR images?"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  TF_ENVIRONMENT: ${{ inputs.environment }}
  PROJECT_NAME: multi-agent-pipeline
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE || 'multi-agent-pipeline-tfstate-locks' }}

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Safety Gate
  # ────────────────────────────────────────────────────────────
  safety-check:
    name: Safety Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "destroy" ]; then
            echo "❌ Confirmation failed. You must type 'destroy' to proceed."
            echo "   Received: '${{ inputs.confirm }}'"
            exit 1
          fi
          echo "✅ Destruction confirmed for environment: ${{ env.TF_ENVIRONMENT }}"

      - name: Block production without approval
        if: inputs.environment == 'prod'
        run: |
          echo "⚠️ PRODUCTION DESTROY REQUESTED"
          echo "This will tear down all production AgentCore resources."

  # ────────────────────────────────────────────────────────────
  # Job 2: Terraform Destroy (with remote state)
  # ────────────────────────────────────────────────────────────
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [safety-check]
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Init (remote S3 state)
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.PROJECT_NAME }}/${{ env.TF_ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform Plan (Destroy)
        run: |
          terraform plan \
            -destroy \
            -var="environment=${{ env.TF_ENVIRONMENT }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -out=tfplan-destroy \
            -no-color \
            -input=false

      - name: Upload destroy plan artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: tfplan-destroy-${{ env.TF_ENVIRONMENT }}-${{ github.sha }}
          path: infra/tfplan-destroy
          retention-days: 90

      - name: Terraform Destroy
        run: terraform apply -auto-approve -input=false tfplan-destroy

      - name: Verify state is clean
        run: |
          RESOURCE_COUNT=$(terraform state list 2>/dev/null | wc -l | tr -d ' ')
          if [ "$RESOURCE_COUNT" -eq 0 ]; then
            echo "✅ State is clean — all resources destroyed"
          else
            echo "⚠️ $RESOURCE_COUNT resources still in state:"
            terraform state list
            exit 1
          fi

      - name: Output destruction summary
        if: always()
        run: |
          echo "## 💥 Infrastructure Destroyed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${{ env.TF_ENVIRONMENT }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| State Bucket | \`${{ env.TF_STATE_BUCKET }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| State Key | \`${{ env.PROJECT_NAME }}/${{ env.TF_ENVIRONMENT }}/terraform.tfstate\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Timestamp | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────
  # Job 3: Cleanup ECR (optional)
  # ────────────────────────────────────────────────────────────
  cleanup-ecr:
    name: Cleanup ECR Images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [terraform-destroy]
    if: inputs.delete_ecr_images == true

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete all ECR images
        run: |
          REPO_NAME="${{ env.PROJECT_NAME }}-${{ env.TF_ENVIRONMENT }}"

          echo "Deleting all images from ECR repo: $REPO_NAME"

          IMAGE_IDS=$(aws ecr list-images \
            --repository-name "$REPO_NAME" \
            --query 'imageIds[*]' \
            --output json 2>/dev/null || echo "[]")

          if [ "$IMAGE_IDS" = "[]" ] || [ -z "$IMAGE_IDS" ]; then
            echo "No images found or repository already deleted."
          else
            aws ecr batch-delete-image \
              --repository-name "$REPO_NAME" \
              --image-ids "$IMAGE_IDS"
            echo "✅ All images deleted from $REPO_NAME"
          fi
