# ──────────────────────────────────────────────────────────────
# Deploy Pipeline
#
# Triggers: push to master, pull request into master, manual dispatch
# Steps:
#   1. Build & push Docker image to ECR
#   2. Sync Anthropic API key → Secrets Manager
#   3. Terraform init (remote S3 state) → plan → apply
#
# On a pull request this is a DRY RUN: build the image and run
# fmt/validate/plan, then stop. Apply, the raw_data sync and the secret
# writes are gated on `github.event_name != 'pull_request'`, so a PR proves
# the image builds and the plan is clean without mutating the environment.
# PR builds are also tagged with the SHA only — `latest` moves on master.
# ──────────────────────────────────────────────────────────────

name: Deploy AgentCore Pipeline

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "requirements.txt"
      - "infra/**"
      - ".github/workflows/deploy.yml"
      - "raw_data/**"
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
    paths:
      - "src/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "requirements.txt"
      - "infra/**"
      - ".github/workflows/deploy.yml"
      - "raw_data/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, staging, prod]

concurrency:
  # PR dry runs get their own lane per PR: they must never queue behind — or
  # hold up — a real master deploy of the same environment. Superseded PR runs
  # are cancelled; master deploys are never cancelled mid-apply.
  group: deploy-${{ inputs.environment || 'dev' }}-${{ github.event.pull_request.number || 'master' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  TF_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  PROJECT_NAME: multi-agent-pipeline
  # TF_STATE_BUCKET is NOT configured here — it is derived from the live AWS
  # account id in the "Bootstrap Terraform backend" step (same naming scheme as
  # infra/bootstrap: <project>-tfstate-<account_id>). Hardcoding it in a repo
  # variable broke the deploy when the AWS account rotated: init kept pointing at
  # the old account's bucket and failed with AllAccessDisabled.
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE || 'multi-agent-pipeline-tfstate-locks' }}
  
  # Terraform automatically picks up variables prefixed with TF_VAR_
  # PAT_SECRET_ARN is intentionally omitted — Terraform creates its own
  # github-pat secret. The actual token value is synced in sync-secrets job via GH_PAT.
  TF_VAR_github_target_repo: ${{ vars.TARGET_REPO }}

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Build & Push Container Image
  # ────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_repo: ${{ steps.meta.outputs.ecr_repo }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          REPO_NAME="${{ env.PROJECT_NAME }}-${{ env.TF_ENVIRONMENT }}"
          aws ecr describe-repositories --repository-names "$REPO_NAME" || \
          aws ecr create-repository --repository-name "$REPO_NAME" --image-scanning-configuration scanOnPush=true

      - name: Set image metadata
        id: meta
        run: |
          ECR_REPO="${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ env.TF_ENVIRONMENT }}"
          IMAGE_TAG="${{ github.sha }}"
          echo "ecr_repo=${ECR_REPO}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          # A PR must not repoint `latest` at unmerged code — SHA tag only.
          {
            echo "tags<<TAGS_EOF"
            echo "${ECR_REPO}:${IMAGE_TAG}"
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "${ECR_REPO}:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ────────────────────────────────────────────────────────────
  # Job 2: Terraform Apply (with remote state)
  # ────────────────────────────────────────────────────────────
  terraform-deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-and-push]

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Pinned exactly. NOTE: setup-terraform resolves constraints with
          # node-semver, which reads "~> 1.9" as "~1.9" (>=1.9.0 <1.10.0) — it
          # never floated past 1.9.x. Spelling the version out avoids that trap.
          terraform_version: "1.9.8"

      # Creates the remote-state bucket + lock table on first run in a fresh AWS
      # account, so a rotated account needs no manual `cd infra/bootstrap` step.
      # Idempotent: existing bucket/table are left untouched.
      - name: Bootstrap Terraform backend
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="${PROJECT_NAME}-tfstate-${ACCOUNT_ID}"
          echo "TF_STATE_BUCKET=${BUCKET}" >> "$GITHUB_ENV"
          echo "Account ${ACCOUNT_ID} → state bucket ${BUCKET}"

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "State bucket already exists"
          else
            echo "Creating state bucket in ${AWS_REGION}"
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
            aws s3api wait bucket-exists --bucket "$BUCKET"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            # SSE-S3 rather than SSE-KMS: no extra kms:* grants needed on the
            # deploy credentials for Terraform to read/write state.
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            echo "✅ Created ${BUCKET}"
          fi

          # Terraform 1.9.x predates S3-native lockfiles (use_lockfile, 1.10+),
          # so the DynamoDB lock table is still required.
          if aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" >/dev/null 2>&1; then
            echo "Lock table ${TF_LOCK_TABLE} already exists"
          else
            echo "Creating lock table ${TF_LOCK_TABLE}"
            aws dynamodb create-table --table-name "$TF_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST >/dev/null
            aws dynamodb wait table-exists --table-name "$TF_LOCK_TABLE"
            echo "✅ Created ${TF_LOCK_TABLE}"
          fi

      - name: Terraform Init (remote S3 state)
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${PROJECT_NAME}/${TF_ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate
        
      - name: Terraform Plan
        run: |
          terraform plan \
            -var="environment=${{ env.TF_ENVIRONMENT }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="ecr_image_tag=${{ needs.build-and-push.outputs.image_tag }}" \
            -out=tfplan \
            -no-color \
            -input=false

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.TF_ENVIRONMENT }}-${{ github.sha }}
          path: infra/tfplan
          retention-days: 30

      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        run: terraform apply -auto-approve -input=false tfplan

      - name: Sync raw data to S3
        if: github.event_name != 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          if [ -d "raw_data" ]; then
            BUCKET_NAME=$(cd infra && terraform output -raw raw_data_bucket_name)
            aws s3 sync raw_data/ "s3://${BUCKET_NAME}/raw_data/" --delete
            echo "✅ raw_data/ synced to s3://${BUCKET_NAME}/raw_data/"
          else
            echo "ℹ️ raw_data/ directory not found — skipping sync"
          fi

      - name: Plan summary (pull request dry run)
        if: github.event_name == 'pull_request'
        run: |
          echo "## 🔍 Dry run — plan only" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image built and pushed as \`${{ needs.build-and-push.outputs.image_tag }}\`;" \
               "Terraform validated and planned. No apply, no raw_data sync," \
               "no secret writes — those run on merge to master." >> "$GITHUB_STEP_SUMMARY"

      - name: Output deployment info
        if: github.event_name != 'pull_request'
        run: |
          echo "## 🚀 Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Resource | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${{ env.TF_ENVIRONMENT }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Tag | \`${{ needs.build-and-push.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runtime ID | \`$(terraform output -raw agent_runtime_id)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runtime ARN | \`$(terraform output -raw agent_runtime_arn)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runtime Endpoint | \`$(terraform output -raw agent_runtime_endpoint)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Memory ID | \`$(terraform output -raw memory_id)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| State Bucket | \`${TF_STATE_BUCKET}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dashboard | $(terraform output -raw cloudwatch_dashboard_url) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Frontend Setup" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "cd frontend" >> "$GITHUB_STEP_SUMMARY"
          echo "echo 'AGENTCORE_RUNTIME_ENDPOINT=$(cd ${{ github.workspace }}/infra && terraform output -raw agent_runtime_endpoint)' > .env.local" >> "$GITHUB_STEP_SUMMARY"
          echo "npm run dev" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────
  # Job 3: Sync Secrets — runs AFTER Terraform so the secrets
  # always exist before we write values into them. This fixes the
  # race condition that caused keys to be lost after destroy+redeploy.
  # ────────────────────────────────────────────────────────────
  sync-secrets:
    name: Sync API Keys to Secrets Manager
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [terraform-deploy]
    # Never rotate live secrets from an unmerged branch.
    if: github.event_name != 'pull_request'

    steps:
      - name: Sync Anthropic API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SECRET_ID="${{ env.PROJECT_NAME }}-${{ env.TF_ENVIRONMENT }}/anthropic-api-key"
          echo "Writing Anthropic API key to Secrets Manager..."
          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_ID" \
            --secret-string "$ANTHROPIC_API_KEY"
          echo "✅ Anthropic API key synced"

      - name: Sync GitHub PAT
        # GH_PAT is optional — skip silently if not configured
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "ℹ️ GH_PAT secret not configured — skipping GitHub PAT sync"
            echo "   Add GH_PAT to your GitHub Actions secrets to enable submit_pr"
            exit 0
          fi
          SECRET_ID="${{ env.PROJECT_NAME }}-${{ env.TF_ENVIRONMENT }}/github-pat"
          echo "Writing GitHub PAT to Secrets Manager..."
          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_ID" \
            --secret-string "$GH_PAT"
          echo "✅ GitHub PAT synced — submit_pr tool will use this token"
