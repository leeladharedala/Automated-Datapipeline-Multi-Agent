# ──────────────────────────────────────────────────────────────
# Deploy Pipeline
#
# Triggers: push to master, manual dispatch
# Steps:
#   1. Build & push Docker image to ECR
#   2. Sync Anthropic API key → Secrets Manager
#   3. Terraform init (remote S3 state) → plan → apply
# ──────────────────────────────────────────────────────────────

name: Deploy AgentCore Pipeline

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "requirements.txt"
      - "infra/**"
      - ".github/workflows/deploy.yml"
      - "raw_data/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, staging, prod]

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  TF_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  PROJECT_NAME: multi-agent-pipeline
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE || 'multi-agent-pipeline-tfstate-locks' }}
  
  # Terraform automatically picks up variables prefixed with TF_VAR_
  # PAT_SECRET_ARN is intentionally omitted — Terraform creates its own
  # github-pat secret. The actual token value is synced in sync-secrets job via GH_PAT.
  TF_VAR_github_target_repo: ${{ vars.TARGET_REPO }}

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Build & Push Container Image
  # ────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_repo: ${{ steps.meta.outputs.ecr_repo }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          REPO_NAME="${{ env.PROJECT_NAME }}-${{ env.TF_ENVIRONMENT }}"
          aws ecr describe-repositories --repository-names "$REPO_NAME" || \
          aws ecr create-repository --repository-name "$REPO_NAME" --image-scanning-configuration scanOnPush=true

      - name: Set image metadata
        id: meta
        run: |
          ECR_REPO="${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ env.TF_ENVIRONMENT }}"
          IMAGE_TAG="${{ github.sha }}"
          echo "ecr_repo=${ECR_REPO}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.meta.outputs.ecr_repo }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.ecr_repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ────────────────────────────────────────────────────────────
  # Job 2: Terraform Apply (with remote state)
  # ────────────────────────────────────────────────────────────
  terraform-deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-and-push]

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Init (remote S3 state)
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.PROJECT_NAME }}/${{ env.TF_ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=us-west-2" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate
        
      - name: Repair Corrupted Gateway State
        run: |
          echo "Current terraform state:"
          terraform state list
          echo "Attempting to remove gateway objects:"
          terraform state rm 'aws_bedrockagentcore_gateway_target.terraform_registry' || echo "Failed reg"
          terraform state rm 'aws_bedrockagentcore_gateway_target.aws_docs' || echo "Failed docs"
          terraform state rm 'aws_bedrockagentcore_gateway.mcp' || echo "Failed mcp"
          echo "State after cleanup:"
          terraform state list


      - name: Terraform Plan
        run: |
          terraform plan \
            -var="environment=${{ env.TF_ENVIRONMENT }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="ecr_image_tag=${{ needs.build-and-push.outputs.image_tag }}" \
            -out=tfplan \
            -no-color \
            -input=false

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.TF_ENVIRONMENT }}-${{ github.sha }}
          path: infra/tfplan
          retention-days: 30

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false tfplan

      - name: Sync raw data to S3
        working-directory: ${{ github.workspace }}
        run: |
          if [ -d "raw_data" ]; then
            BUCKET_NAME=$(cd infra && terraform output -raw raw_data_bucket_name)
            aws s3 sync raw_data/ "s3://${BUCKET_NAME}/raw_data/" --delete
            echo "✅ raw_data/ synced to s3://${BUCKET_NAME}/raw_data/"
          else
            echo "ℹ️ raw_data/ directory not found — skipping sync"
          fi

      - name: Output deployment info
        run: |
          echo "## 🚀 Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Resource | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${{ env.TF_ENVIRONMENT }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Tag | \`${{ needs.build-and-push.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runtime ID | \`$(terraform output -raw agent_runtime_id)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runtime ARN | \`$(terraform output -raw agent_runtime_arn)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runtime Endpoint | \`$(terraform output -raw agent_runtime_endpoint)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Memory ID | \`$(terraform output -raw memory_id)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| State Bucket | \`${{ env.TF_STATE_BUCKET }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dashboard | $(terraform output -raw cloudwatch_dashboard_url) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Frontend Setup" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "cd frontend" >> "$GITHUB_STEP_SUMMARY"
          echo "echo 'AGENTCORE_RUNTIME_ENDPOINT=$(cd ${{ github.workspace }}/infra && terraform output -raw agent_runtime_endpoint)' > .env.local" >> "$GITHUB_STEP_SUMMARY"
          echo "npm run dev" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────
  # Job 3: Sync Secrets — runs AFTER Terraform so the secrets
  # always exist before we write values into them. This fixes the
  # race condition that caused keys to be lost after destroy+redeploy.
  # ────────────────────────────────────────────────────────────
  sync-secrets:
    name: Sync API Keys to Secrets Manager
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [terraform-deploy]

    steps:
      - name: Sync Anthropic API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SECRET_ID="${{ env.PROJECT_NAME }}-${{ env.TF_ENVIRONMENT }}/anthropic-api-key"
          echo "Writing Anthropic API key to Secrets Manager..."
          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_ID" \
            --secret-string "$ANTHROPIC_API_KEY"
          echo "✅ Anthropic API key synced"

      - name: Sync GitHub PAT
        # GH_PAT is optional — skip silently if not configured
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "ℹ️ GH_PAT secret not configured — skipping GitHub PAT sync"
            echo "   Add GH_PAT to your GitHub Actions secrets to enable submit_pr"
            exit 0
          fi
          SECRET_ID="${{ env.PROJECT_NAME }}-${{ env.TF_ENVIRONMENT }}/github-pat"
          echo "Writing GitHub PAT to Secrets Manager..."
          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_ID" \
            --secret-string "$GH_PAT"
          echo "✅ GitHub PAT synced — submit_pr tool will use this token"
