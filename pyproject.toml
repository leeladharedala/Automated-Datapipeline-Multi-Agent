[project]
name = "multi-agent-data-pipeline"
version = "0.1.0"
description = "LangGraph Multi-Agent Orchestrator"
authors = [
    {name = "User",email = "user@example.com"}
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "deepagents>=0.1.0",
    "langgraph>=1.1.4,<2.0",
    "langchain-core>=0.3.0,<1.0",
    "langchain-anthropic>=0.3.0,<1.0",
    "langchain-openai>=0.3.0,<1.0",
    "langchain-mcp-adapters>=0.1.0,<1.0",
    "copilotkit>=0.1.88,<1.0",
    "langgraph-checkpoint-aws>=0.1.0,<1.0",
    "boto3>=1.35.0,<2.0",
    "PyGithub>=2.5.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "opentelemetry-api>=1.28.0,<2.0",
    "opentelemetry-sdk>=1.28.0,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0,<2.0",
    "opentelemetry-propagator-aws-xray>=1.0.0,<2.0",
    "opentelemetry-sdk-extension-aws>=2.0.0,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "hypothesis>=6.100,<7.0",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
